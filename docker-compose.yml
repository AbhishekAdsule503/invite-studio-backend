services:
  db:
    image: postgres:16-alpine
    container_name: invite-studio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: invite_studio
    ports:
      - "5434:5432"
    volumes:
      - invite_studio_pgdata:/var/lib/postgresql/data
volumes:
  invite_studio_pgdata:
